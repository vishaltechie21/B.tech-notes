<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AKTU B.Tech Notes</title>
  <link rel="icon" type="image/png" href="https://i.ibb.co/qnsSMXm/21vishalthakur-253090887-627483071606566-1643709613012544702-n.png">
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <!-- Background animation -->
  <div class="bg-shapes">
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
    <div class="shape shape-3"></div>
  </div>

  <div class="app-container">
    <header>
      <div class="header-content">
        <img src="https://i.ibb.co/qnsSMXm/21vishalthakur-253090887-627483071606566-1643709613012544702-n.png" alt="Logo" class="logo">
        <h1>AKTU Notes Hub</h1>
      </div>
      <p class="subtitle">Comprehensive B.Tech Notes for CSE Students</p>
      
      <div class="action-buttons">
        <button id="Install" class="btn btn-outline" style="display: none;">
          <i class="fab fa-android"></i> Install App
        </button>
        <button id="share-on-whatsapp-button" class="btn btn-outline btn-whatsapp">
          <i class="fab fa-whatsapp"></i> Share
        </button>
      </div>
    </header>

    <main class="glass-card">
      <div class="form-group">
        <label for="yearSelector"><i class="fas fa-calendar-alt"></i> Select Year</label>
        <select id="yearSelector" class="form-control">
          <option value="" disabled selected>Choose Year</option>
          <option value="year1">First Year (1st)</option>
          <option value="year2">Second Year (2nd)</option>
          <option value="year3">Third Year (3rd)</option>
        </select>
      </div>

      <div class="form-group">
        <label for="subject"><i class="fas fa-book"></i> Select Subject</label>
        <select id="subject" class="form-control" disabled>
          <option value="" disabled selected>Please select a year first</option>
        </select>
      </div>

      <div class="form-group">
        <label for="unit"><i class="fas fa-layer-group"></i> Select Unit</label>
        <select id="unit" class="form-control" disabled>
          <option value="" disabled selected>Please select a subject first</option>
        </select>
      </div>

      <button id="downloadBtn" class="btn btn-primary btn-block" disabled>
        <i class="fas fa-cloud-download-alt"></i> Download PDF
      </button>
    </main>

    <div class="video-promo">
      <a href="https://youtube.com/shorts/hou2MJLn5hU?si=VXvauNUTWy5qX1TI" target="_blank" class="promo-link">
        <span class="pulse-icon"><i class="fab fa-youtube"></i></span>
        <span>New Video! Must Watch</span>
        <i class="fas fa-arrow-right"></i>
      </a>
    </div>

    <footer>
      <p>Connect with me:</p>
      <div class="social-links">
        <a href="https://www.instagram.com/21vishalthakur/" target="_blank" class="social-link instagram">
          <i class="fab fa-instagram"></i>
        </a>
        <a href="https://www.youtube.com/channel/UCt2IVERCBm5-97FUyC7tNnw" target="_blank" class="social-link youtube">
          <i class="fab fa-youtube"></i>
        </a>
      </div>
      <p class="footer-note">Have better notes? DM me on Instagram!</p>
    </footer>
  </div>

  <script src="./page.js"></script>
</body>
</html>
